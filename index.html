<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Cocktail Menu</title>

    <link rel="stylesheet" href="style.css">

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

</head>


<body>

    <!-- MENU -->

    <div id="menu">

        <h1>AR Cocktail Menu</h1>

        <button onclick="showDrink('mojito')">
            Mojito
        </button>

        <button onclick="showDrink('negroni')">
            Negroni
        </button>

        <button onclick="showDrink('martini')">
            Martini
        </button>

    </div>


    <!-- 3D MODEL PAGE -->

    <div id="drink">

        <button onclick="backToMenu()">
            Back
        </button>

        <h2 id="drinkName"></h2>

        <model-viewer
            id="viewer"
            src=""
            camera-controls
            auto-rotate
            autoplay
            ar>
        </model-viewer>

    </div>


    <script src="script.js"></script>

</body>

</html>
